<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Echoes of Expression AR Exhibition</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- 1. 8th Wall Engine & Extras (2026 Distributed Engine) -->
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" crossorigin="anonymous" data-preload-chunks="slam" async></script>
    <script src="https://cdn.8thwall.com/web/aframe/8frame-1.5.0.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous" async></script>
  </head>
  
  <body style="margin: 0; overflow: hidden;">
    <!-- 
      This product includes the XR Engine software developed by Niantic Spatial, Inc.
      Copyright © 2026 Niantic Spatial, Inc. All rights reserved. 
    -->

    <script>
      window.systemLogs = [];
      window.xrState = "Initializing...";
      
      window.addLog = (msg, type = 'log') => {
        const time = new Date().toLocaleTimeString();
        window.systemLogs.push({ time, msg, type });
        if (window.systemLogs.length > 100) window.systemLogs.shift();
        if (window.updateDebugUI) window.updateDebugUI();
      };
      console.log = (...args) => { addLog(args.join(' '), 'log'); };
      console.warn = (...args) => { addLog(args.join(' '), 'warn'); };
      console.error = (...args) => { addLog(args.join(' '), 'error'); };

      window.addEventListener('realityready', () => { window.xrState = "Reality Ready (Live)"; });
      window.addEventListener('xrtrackingstatus', (e) => { window.xrState = "Tracking: " + e.detail.status; });
      
      window.copyLogs = () => {
        const text = window.systemLogs.map(l => `[${l.time}] ${l.msg}`).join('\n');
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta);
        alert("Logs copied!");
      };
      
      window.toggleDebug = () => {
        const p = document.getElementById('debug-panel');
        p.style.display = p.style.display === 'none' ? 'block' : 'none';
      };
    </script>

    <div style="display:none;">
      <video id="engine_promo" src="Expression/Individual artwork/Engine Video/Engine AR Promo.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
    </div>

    <div id="ui-container">
      <h3>Echoes of Expression</h3>
      <div id="gps-status">Checking GPS...</div>
    </div>

    <button class="debug-btn" onclick="toggleDebug()">Debug</button>
    
    <div id="debug-panel">
      <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
        <strong>System Debug</strong>
        <button onclick="copyLogs()" style="font-size: 10px;">Copy Logs</button>
      </div>
      <div id="debug-content"></div>
    </div>
    
    <a-scene
      xrweb
      xrextras-almost-there
      xrextras-loading
      xrextras-runtime-error
      vr-mode-ui="enabled: false"
      renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true; colorManagement: true;">
      
      <a-assets></a-assets>

      <a-camera 
        id="camera" 
        camera="near: 0.1; far: 10000;" 
        xrextras-camera-pipeline 
        raycaster="objects: .clickable">
      </a-camera>

      <a-entity gps-north-align>
        <!-- Who We Are -->
        <a-entity data-name="Victory Statue Cameo" gps-new-place="latitude: 37.335404; longitude: -121.882501; modelId: Expression/wwa_cameo.glb;"></a-entity>
        <a-entity data-name="Victory Statue Pt 1" gps-new-place="latitude: 37.335500; longitude: -121.882556; modelId: Expression/wwa_pt_01_vict_stat.glb;"></a-entity>
        
        <a-entity data-name="Path to Victory" gps-new-place="latitude: 37.335722; longitude: -121.882500;">
          <a-entity gltf-model="Expression/wwa_pt_03_tow_hall_draco" position="0 0 0"></a-entity>
          <a-entity gltf-model="Expression/wwa_endangered_draco" position="2 0 0"></a-entity>
        </a-entity>

        <a-entity data-name="Tower Hall Lawn" gps-new-place="latitude: 37.335472; longitude: -121.883389; modelId: Expression/wwa_pt_02_tow_hall.glb;"></a-entity>

        <!-- Echoes of Expression -->
        <a-entity data-name="MLK Official Map" gps-new-place="latitude: 37.335306; longitude: -121.884556; modelId: Expression/immersion_eoe_official_library_map.glb;"></a-entity>
        
        <!-- Monster model missing from repo, placeholder used below if found -->
        <a-entity data-name="Monster (Missing)" gps-new-place="latitude: 37.335778; longitude: -121.885500;"></a-entity>

        <a-entity data-name="Commotion Walkway" gps-new-place="latitude: 37.336111; longitude: -121.885083;">
          <a-entity gltf-model="Expression/immersion_eoe_commotion_pt_01.glb" position="-2 0 0"></a-entity>
          <a-entity gltf-model="Expression/immersion_eoe_commotion_pt_02.glb" position="0 0 0"></a-entity>
          <a-entity gltf-model="Expression/immersion_eoe_commotion_pt_03.glb" position="2 0 0"></a-entity>
        </a-entity>

        <a-entity data-name="Commotion Theatre" gps-new-place="latitude: 37.336278; longitude: -121.884778;">
          <a-entity gltf-model="Expression/immersion_eoe_commotion_pt_04.glb" position="-2 0 0"></a-entity>
          <a-entity gltf-model="Expression/immersion_eoe_commotion_pt_05.glb" position="0 0 0"></a-entity>
          <a-entity gltf-model="Expression/immersion_eoe_commotion_pt_06.glb" position="2 0 0"></a-entity>
        </a-entity>

        <a-entity data-name="TV Animation" gps-new-place="latitude: 37.336500; longitude: -121.884972; modelId: Expression/immersion_eoe_TV_animation.glb;"></a-entity>
        
        <!-- text_as_image_draco is the optimized version -->
        <a-entity data-name="Text as Image" gps-new-place="latitude: 37.336849; longitude: -121.885216; modelId: Expression/text_as_image_draco;"></a-entity>

        <a-entity data-name="Bird Animation" gps-new-place="latitude: 37.337694; longitude: -121.885472; modelId: Expression/immersion_eoe_abstract_bird_animation.glb;"></a-entity>
        <a-entity data-name="Spongebob" gps-new-place="latitude: 37.337472; longitude: -121.885667; modelId: Expression/immersion_eoe_spongemeboi_animation.glb;"></a-entity>
        
        <a-video data-name="Engine Promo Video" src="#engine_promo" width="16" height="9" gps-new-place="latitude: 37.337667; longitude: -121.886417;" play-on-click class="clickable"></a-video>
      </a-entity>
    </a-scene>

    <!-- Post-scene scripts -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/draco_decoder.js"></script>
    <script src="https://unpkg.com/meshoptimizer@0.21.0/meshopt_decoder.js"></script>
    <script src="app.js"></script>
  </body>
</html>
