<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Echoes of Expression AR Exhibition</title>
    <!-- Import 8frame (Open Source A-Frame fork optimized for 8th Wall) and AR.js for location-based AR -->
    <script src="https://cdn.8thwall.com/web/aframe/8frame-1.5.0.min.js"></script>
    
    <!-- 8thWall Open Source Engine Binary & UI -->
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" crossorigin="anonymous"></script>

    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Custom Logic -->
    <script src="app.js"></script>
  </head>
  
  <body style="margin: 0; overflow: hidden;">
    <div id="ui-container">
      <h3>Echoes of Expression</h3>
      <div id="gps-status">Finding location...</div>
    </div>
    
    <a-scene
      xrweb="scale: absolute"
      xrextras-almost-there
      xrextras-loading
      xrextras-runtime-error
      vr-mode-ui="enabled: false"
      renderer="antialias: true; alpha: true"
    >
      <a-assets>
        <!-- Preload 3D Models -->
        <a-asset-item id="wwa_pt_01" src="Expression/wwa_pt_01.glb"></a-asset-item>
        <a-asset-item id="wwa_pt_02" src="Expression/wwa_pt_02.glb"></a-asset-item>
        <a-asset-item id="lib_map" src="Expression/immersion_eoe_official_library_map.glb"></a-asset-item>
        <a-asset-item id="monster" src="Expression/eoe_monster_animation.glb"></a-asset-item>
        
        <a-asset-item id="commotion_01" src="Expression/immersion_eoe_commotion_pt_01.glb"></a-asset-item>
        <a-asset-item id="commotion_02" src="Expression/immersion_eoe_commotion_pt_02.glb"></a-asset-item>
        <a-asset-item id="commotion_03" src="Expression/immersion_eoe_commotion_pt_03.glb"></a-asset-item>
        <a-asset-item id="commotion_04" src="Expression/immersion_eoe_commotion_pt_04.glb"></a-asset-item>
        <a-asset-item id="commotion_05" src="Expression/immersion_eoe_commotion_pt_05.glb"></a-asset-item>
        <a-asset-item id="commotion_06" src="Expression/immersion_eoe_commotion_pt_06.glb"></a-asset-item>

        <a-asset-item id="tv_anim" src="Expression/immersion_eoe_TV_animation.glb"></a-asset-item>
        <a-asset-item id="text_img" src="Expression/text_as_image.glb"></a-asset-item>
        <a-asset-item id="bird_anim" src="Expression/immersion_eoe_abstract_bird_animation.glb"></a-asset-item>
        <a-asset-item id="spongebob" src="Expression/immersion_eoe_spongemeboi_animation.glb"></a-asset-item>

        <!-- Preload Video -->
        <video id="engine_promo" src="Expression/Individual artwork/Engine Video/Engine AR Promo.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <!-- The AR Camera -->
      <a-camera position="0 1.6 0"></a-camera>

      <!-- World wrapper for North alignment using device compass -->
      <a-entity gps-north-align>
        
        <!-- ARTWORK ENTITIES mapped to specific GPS Coordinates -->
        
        <!-- Path to Victory: 37°20'08.6"N 121°52'57.0"W -->
        <a-entity gltf-model="#wwa_pt_01" gps-new-place="latitude: 37.335722; longitude: -121.882500;" scale="1 1 1"></a-entity>

        <!-- Tower Hall Lawn Area: 37°20'07.7"N 121°53'00.2"W -->
        <a-entity gltf-model="#wwa_pt_02" gps-new-place="latitude: 37.335472; longitude: -121.883389;" scale="1 1 1"></a-entity>

        <!-- Main Entrance to MLK Library - SJSU Side: 37°20'07.1"N 121°53'04.4"W -->
        <a-entity gltf-model="#lib_map" gps-new-place="latitude: 37.335306; longitude: -121.884556;" scale="1 1 1"></a-entity>

        <!-- Main Entrance to MLK Library - City Side: 37°20'08.8"N 121°53'07.8"W -->
        <a-entity gltf-model="#monster" gps-new-place="latitude: 37.335778; longitude: -121.885500;" scale="1 1 1" animation-mixer></a-entity>

        <!-- SJSU Sidewalk E San Fernando - Walkway to Library: 37°20'10.0"N 121°53'06.3"W -->
        <a-entity gps-new-place="latitude: 37.336111; longitude: -121.885083;">
          <a-entity gltf-model="#commotion_01" position="-2 0 0" scale="1 1 1"></a-entity>
          <a-entity gltf-model="#commotion_02" position="0 0 0" scale="1 1 1"></a-entity>
          <a-entity gltf-model="#commotion_03" position="2 0 0" scale="1 1 1"></a-entity>
        </a-entity>

        <!-- SJSU Sidewalk E San Fernando - Film & Theatre: 37°20'10.6"N 121°53'05.2"W -->
        <a-entity gps-new-place="latitude: 37.336278; longitude: -121.884778;">
          <a-entity gltf-model="#commotion_04" position="-2 0 0" scale="1 1 1"></a-entity>
          <a-entity gltf-model="#commotion_05" position="0 0 0" scale="1 1 1"></a-entity>
          <a-entity gltf-model="#commotion_06" position="2 0 0" scale="1 1 1"></a-entity>
        </a-entity>

        <!-- Corner of 5th & E San Fernando: 37°20'11.4"N 121°53'05.9"W -->
        <a-entity gltf-model="#tv_anim" gps-new-place="latitude: 37.336500; longitude: -121.884972;" scale="1 1 1" animation-mixer></a-entity>

        <!-- S 5th St: 37.336849, -121.885216 -->
        <a-entity gltf-model="#text_img" gps-new-place="latitude: 37.336849; longitude: -121.885216;" scale="1 1 1"></a-entity>

        <!-- City Hall 5th St Entrance & Courtyard Seating: 37°20'15.7"N 121°53'07.7"W -->
        <a-entity gltf-model="#bird_anim" gps-new-place="latitude: 37.337694; longitude: -121.885472;" scale="1 1 1" animation-mixer></a-entity>

        <!-- South Entrance City Hall: 37°20'14.9"N 121°53'08.4"W -->
        <a-entity gltf-model="#spongebob" gps-new-place="latitude: 37.337472; longitude: -121.885667;" scale="1 1 1" animation-mixer></a-entity>

        <!-- City Hall Plaza Center: 37°20'15.6"N 121°53'11.1"W (Video) -->
        <a-video src="#engine_promo" width="16" height="9" gps-new-place="latitude: 37.337667; longitude: -121.886417;" scale="1 1 1" play-on-click class="clickable"></a-video>
      </a-entity>
      
    </a-scene>
  </body>
</html>
