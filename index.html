<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Echoes of Expression AR Exhibition</title>
    
    <!-- 1. 8th Wall Core & A-Frame (The ONLY 3D engine allowed) -->
    <script src="https://cdn.8thwall.com/web/aframe/8frame-1.5.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" crossorigin="anonymous"></script>

    <!-- 2. Utilities (Removed aframe-extras to fix Three.js conflict) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <link rel="stylesheet" href="style.css">
  </head>
  
  <body style="margin: 0; overflow: hidden;">
    <div id="ui-container">
      <h3>Echoes of Expression</h3>
      <div id="gps-status">Finding location...</div>
    </div>
    
    <a-scene
      xrweb="scale: absolute"
      xrextras-almost-there
      xrextras-loading
      xrextras-runtime-error
      vr-mode-ui="enabled: false"
      renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true;"
    >
      <a-assets>
        <a-asset-item id="monster" src="Expression/eoe_monster_animation.glb"></a-asset-item>
        <a-asset-item id="commotion_01" src="Expression/immersion_eoe_commotion_pt_01.glb"></a-asset-item>
        <a-asset-item id="commotion_02" src="Expression/immersion_eoe_commotion_pt_02.glb"></a-asset-item>
        <a-asset-item id="commotion_03" src="Expression/immersion_eoe_commotion_pt_03.glb"></a-asset-item>
        <a-asset-item id="commotion_04" src="Expression/immersion_eoe_commotion_pt_04.glb"></a-asset-item>
        <a-asset-item id="commotion_05" src="Expression/immersion_eoe_commotion_pt_05.glb"></a-asset-item>
        <a-asset-item id="commotion_06" src="Expression/immersion_eoe_commotion_pt_06.glb"></a-asset-item>
        <a-asset-item id="tv_anim" src="Expression/immersion_eoe_TV_animation.glb"></a-asset-item>
        <a-asset-item id="bird_anim" src="Expression/immersion_eoe_abstract_bird_animation.glb"></a-asset-item>
        <a-asset-item id="spongebob" src="Expression/immersion_eoe_spongemeboi_animation.glb"></a-asset-item>
        <video id="engine_promo" src="Expression/Individual artwork/Engine Video/Engine AR Promo.mp4" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 1.6 0"></a-camera>

      <a-entity gps-north-align>
        <!-- HEAVY MODELS -->
        <a-entity gps-new-place="latitude: 37.336849; longitude: -121.885216; modelId: Expression/text_as_image.glb; activationDist: 50;" scale="1 1 1"></a-entity>
        <a-entity gps-new-place="latitude: 37.335722; longitude: -121.882500; modelId: Expression/wwa_pt_01.glb; activationDist: 50;" scale="1 1 1"></a-entity>
        <a-entity gps-new-place="latitude: 37.335472; longitude: -121.883389; modelId: Expression/wwa_pt_02.glb; activationDist: 50;" scale="1 1 1"></a-entity>
        <a-entity gps-new-place="latitude: 37.335306; longitude: -121.884556; modelId: Expression/immersion_eoe_official_library_map.glb; activationDist: 50;" scale="1 1 1"></a-entity>

        <!-- SMALL MODELS -->
        <a-entity gps-new-place="latitude: 37.335778; longitude: -121.885500; modelId: #monster;" scale="1 1 1"></a-entity>
        <a-entity gps-new-place="latitude: 37.336111; longitude: -121.885083; modelId: #commotion_wrapper;">
          <a-entity id="commotion_wrapper">
            <a-entity gltf-model="#commotion_01" position="-2 0 0" scale="1 1 1"></a-entity>
            <a-entity gltf-model="#commotion_02" position="0 0 0" scale="1 1 1"></a-entity>
            <a-entity gltf-model="#commotion_03" position="2 0 0" scale="1 1 1"></a-entity>
          </a-entity>
        </a-entity>
        <a-entity gps-new-place="latitude: 37.336500; longitude: -121.884972; modelId: #tv_anim;" scale="1 1 1"></a-entity>
        <a-entity gps-new-place="latitude: 37.337694; longitude: -121.885472; modelId: #bird_anim;" scale="1 1 1"></a-entity>
        <a-entity gps-new-place="latitude: 37.337472; longitude: -121.885667; modelId: #spongebob;" scale="1 1 1"></a-entity>
        <a-video src="#engine_promo" width="16" height="9" gps-new-place="latitude: 37.337667; longitude: -121.886417;" scale="1 1 1" play-on-click class="clickable"></a-video>
      </a-entity>
    </a-scene>

    <!-- WASM Decoders & Custom Logic -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/draco_decoder.js"></script>
    <script src="https://unpkg.com/meshoptimizer@0.21.0/meshopt_decoder.js"></script>
    <script src="app.js"></script>
  </body>
</html>
